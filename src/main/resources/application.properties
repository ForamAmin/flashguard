# ===============================
# Application
# ===============================
spring.application.name=flashguard

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:flashguard}
spring.datasource.username=flashguard
spring.datasource.password=flashguard_dev_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# Redis
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}